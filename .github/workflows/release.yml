name: Release

# Publishes a release for a tag like v0.1.0. Normally auto-release.yml
# calls this when a version bump lands on main (it makes the tag itself); a
# tag pushed by hand still works. Builds both static binaries, checksums
# them, signs them with minisign when the NODE_MINISIGN_KEY secret exists,
# and records GitHub build provenance (keyless, no secret needed).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z), already pushed
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
          - target: arm-unknown-linux-musleabihf
            arch: armv6
          - target: i686-unknown-linux-musl
            arch: i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        run: |
          pip3 install --user ziglang==0.17.1
          cargo install --locked cargo-zigbuild@0.24.1
      - name: Check the tag matches the crate version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "${TAG}" || { echo "tag ${TAG} but Cargo.toml says $v"; exit 1; }
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir out
          for b in nightgrid-node nightgrid-hub; do
            cp "target/${{ matrix.target }}/release/$b" "out/$b-${TAG}-${{ matrix.arch }}-linux"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            CHANGELOG.md
            ci/manifest.py
            crates/proto/src/lib.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: out
      - name: Manifest
        run: python3 ci/manifest.py out "$TAG" crates/proto/src/lib.rs > "$RUNNER_TEMP/manifest.json" && mv "$RUNNER_TEMP/manifest.json" out/ && cat out/manifest.json
      - name: Checksums
        working-directory: out
        run: sha256sum nightgrid-node-* nightgrid-hub-* manifest.json > SHA256SUMS && cat SHA256SUMS
      - name: Sign with minisign (if the key is configured)
        env:
          KEY: ${{ secrets.NODE_MINISIGN_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "NODE_MINISIGN_KEY not set: skipping signatures"; exit 0; fi
          sudo apt-get -qq update && sudo apt-get -qq install -y minisign
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/node.key"
          for f in out/nightgrid-node-* out/nightgrid-hub-* out/manifest.json out/SHA256SUMS; do
            minisign -S -s "$RUNNER_TEMP/node.key" -m "$f" -t "nightgrid-node ${TAG} $(basename "$f")" </dev/null
          done
          rm -f "$RUNNER_TEMP/node.key"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/nightgrid-node-*
            out/nightgrid-hub-*
            out/manifest.json
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          {
            awk -v v="$v" '$0 ~ "^## "v" " {p=1; next} /^## / && p {exit} p' CHANGELOG.md \
              | sed "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/#g"
            printf '\n## Install\n\n'
            printf 'Two static binaries per architecture (x86_64, aarch64, armv7, armv6, i686), each with its systemd units built in (the node also installs on OpenRC and sysvinit). `manifest.json` lists every file with its size and SHA-256, and maps `uname -m` to the arch.\n\n'
            printf -- '- `nightgrid-node`: the Lite agent, for every server.\n'
            printf -- '- `nightgrid-hub`: optional, for one always-on host per network, next to `nightgrid-node`.\n\n'
            printf 'Check them with `sha256sum -c --ignore-missing SHA256SUMS` and, optionally, `gh attestation verify <file> --repo %s`. ' "$GITHUB_REPOSITORY"
            printf 'Steps: [README](https://github.com/%s/blob/%s/README.md#install-by-hand).\n' "$GITHUB_REPOSITORY" "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          grep -q . "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Nightgrid Node $TAG" --notes-file "$RUNNER_TEMP/notes.md" $pre
