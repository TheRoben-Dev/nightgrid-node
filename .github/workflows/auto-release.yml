name: Auto release

# A version bump landing on main is the release: when Cargo.toml's version
# has no vX.Y.Z tag yet, this tags the merged commit and runs release.yml.
# (A tag pushed with GITHUB_TOKEN starts no other workflow, so release.yml is
# called here rather than triggered by the tag.)

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag the version if it is new
        id: tag
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          t="v$v"
          if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
            echo "$t already exists: nothing to release"
            exit 0
          fi
          grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v ' section"; exit 1; }
          git tag "$t" "$GITHUB_SHA"
          git push origin "refs/tags/$t"
          echo "tagged $GITHUB_SHA as $t"
          echo "tag=$t" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
