name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Static build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        run: |
          pip3 install --user ziglang==0.17.1
          cargo install --locked cargo-zigbuild@0.24.1
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static and small
        run: |
          b=target/${{ matrix.target }}/release/nightgrid-node
          file "$b"
          file "$b" | grep -q 'statically linked'
          size=$(stat -c %s "$b")
          echo "size: $size bytes"
          test "$size" -lt 8000000
      - uses: actions/upload-artifact@v4
        with:
          name: nightgrid-node-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/nightgrid-node
          if-no-files-found: error

  install-runner:
    name: Install e2e (${{ matrix.runner }}, real systemd)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nightgrid-node-${{ matrix.target }}
          path: dist-bin
      - run: chmod +x dist-bin/nightgrid-node && dist-bin/nightgrid-node --version
      - run: sudo useradd -m -s /bin/sh tester
      - run: sudo WAIT_FOR_MINUTE=1 UNINSTALL_SH="$PWD/dist/uninstall.sh" sh ci/install-test.sh "$PWD/dist-bin/nightgrid-node" tester

  install-distros:
    name: Install e2e (${{ matrix.image }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "fedora:41"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nightgrid-node-x86_64-unknown-linux-musl
          path: dist-bin
      - run: chmod +x dist-bin/nightgrid-node
      - run: sh ci/container-test.sh "${{ matrix.image }}" "$PWD/dist-bin/nightgrid-node"
