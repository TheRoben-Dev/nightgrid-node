[workspace]
resolver = "2"
members = ["crates/proto", "crates/node", "crates/hub"]

[workspace.package]
version = "0.27.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TheRoben-Dev/nightgrid-node"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
