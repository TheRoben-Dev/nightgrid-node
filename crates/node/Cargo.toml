[package]
name = "nightgrid-node"
description = "Optional, lightweight Nightgrid agent for Linux servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nightgrid-node"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
nightgrid-node-proto = { path = "../proto" }
regex-lite = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.0.7"
x509-parser = "0.18"

[dev-dependencies]
libc = "0.2.191"
tempfile = "3.27.0"
