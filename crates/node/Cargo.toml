[package]
name = "nightgrid-node"
description = "Optional, lightweight Nightgrid agent for Linux servers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nightgrid-node"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
nightgrid-node-proto = { path = "../proto" }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "macros", "sync"] }
toml = "1.0.7"

[dev-dependencies]
libc = "0.2.191"
tempfile = "3.27.0"
