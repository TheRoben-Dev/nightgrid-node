[package]
name = "nightgrid-hub"
description = "Optional Nightgrid hub: one per network, gathers what the Nightgrid Nodes there record"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nightgrid-hub"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
nightgrid-node = { path = "../node" }
nightgrid-node-proto = { path = "../proto" }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.0.7"

[dev-dependencies]
tempfile = "3.27.0"
